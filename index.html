<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吕洞宾大战梁冀 - 重置版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }
        #gameContainer { position: relative; width: 480px; height: 720px; }
        canvas {
            display: block;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
            cursor: crosshair;
            touch-action: none; /* 防止手機滑動螢幕 */
        }
        #ui {
            position: absolute; top: 15px; left: 20px; right: 20px;
            display: flex; justify-content: space-between;
            color: #fff; font-size: 18px; font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            pointer-events: none; z-index: 10;
        }
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.8); border-radius: 12px; z-index: 20;
        }
        .screen h1 { color: #ffd700; font-size: 36px; margin-bottom: 20px; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
        .screen p { color: #ddd; font-size: 16px; margin-bottom: 12px; text-align: center; padding: 0 30px; }
        .btn {
            margin-top: 30px; padding: 15px 50px; font-size: 22px;
            background: #c0392b; color: #fff; border: none; border-radius: 30px;
            cursor: pointer; transition: all 0.2s;
        }
        .btn:hover { transform: scale(1.05); background: #e74c3c; }
        .btn:active { transform: scale(0.95); }
        #finalScore { color: #ffd700; font-size: 32px; margin: 15px 0; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="480" height="720"></canvas>
        <div id="ui">
            <span id="scoreText">分数: 0</span>
            <span id="levelText">关卡: 1</span>
            <span id="ammoText">弹药: 5</span>
        </div>
        
        <div id="startScreen" class="screen">
            <h1>🏹 吕洞宾大战梁冀</h1>
            <p>向後拖拽瞄准，松手发射吕洞宾飞剑</p>
            <p>消灭所有梁冀即可过关！</p>
            <p>⚠️ 小心方块里的梁冀会突然跳出来！</p>
            <button class="btn" id="startBtn">开始游戏</button>
        </div>

        <div id="gameOverScreen" class="screen" style="display: none;">
            <h1 id="endTitle">游戏结束</h1>
            <p id="endMsg"></p>
            <div id="finalScore"></div>
            <button class="btn" id="restartBtn">再来一次</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            // ===== 基礎設定 =====
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const W = canvas.width;
            const H = canvas.height;

            // UI 元素
            const startScreen = document.getElementById('startScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            const scoreText = document.getElementById('scoreText');
            const levelText = document.getElementById('levelText');
            const ammoText = document.getElementById('ammoText');
            const endTitle = document.getElementById('endTitle');
            const endMsg = document.getElementById('endMsg');
            const finalScore = document.getElementById('finalScore');

            // 遊戲狀態變數
            let gameRunning = false;
            let score = 0;
            let level = 1;
            let ammo = 5;
            
            // 實體陣列
            let projectiles = [];
            let boxes = [];
            let enemies = [];
            let particles = [];

            // 拖曳相關
            let isDragging = false;
            let dragStart = { x: 0, y: 0 };
            let dragEnd = { x: 0, y: 0 };

            const launcher = { x: W / 2, y: H - 60, radius: 25 };

            // 關卡配置
            const levelConfigs = [
                [ { x: 80, y: 120 }, { x: 240, y: 80 }, { x: 400, y: 120 } ],
                [ { x: 60, y: 100 }, { x: 180, y: 200 }, { x: 300, y: 100 }, { x: 420, y: 200 } ],
                [ { x: 60, y: 80 }, { x: 160, y: 80 }, { x: 260, y: 80 }, { x: 120, y: 200 }, { x: 360, y: 200 } ],
                [ { x: 80, y: 100 }, { x: 240, y: 60 }, { x: 400, y: 100 }, { x: 160, y: 220 }, { x: 320, y: 220 } ],
                [ { x: 120, y: 80 }, { x: 240, y: 150 }, { x: 360, y: 80 }, { x: 240, y: 300 } ]
            ];

            // ===== 工具函數 =====
            function randomRange(min, max) { return Math.random() * (max - min) + min; }
            
            function checkCollision(c1, r1, c2, r2) {
                let dx = c1.x - c2.x;
                let dy = c1.y - c2.y;
                return Math.sqrt(dx * dx + dy * dy) < (r1 + r2);
            }

            // ===== 繪圖系統 =====
            function drawBackground() {
                let skyGrad = ctx.createLinearGradient(0, 0, 0, H);
                skyGrad.addColorStop(0, '#1a1a3e');
                skyGrad.addColorStop(0.6, '#2d4a2d');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, W, H);

                // 地面
                ctx.fillStyle = '#2a3d28';
                ctx.fillRect(0, H - 100, W, 100);
                ctx.fillStyle = '#5a5a5a';
                ctx.fillRect(W/2 - 60, H - 100, 120, 100);
            }

            function drawLauncher() {
                ctx.fillStyle = '#8b4513';
                ctx.beginPath();
                ctx.arc(launcher.x, launcher.y, launcher.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = '12px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText('发射台', launcher.x, launcher.y - 35);
            }

            function drawEnemy(e) {
                ctx.save();
                ctx.translate(e.x, e.y);
                
                // 身体
                ctx.fillStyle = '#4a6741';
                ctx.beginPath(); ctx.ellipse(0, 10, 15, 20, 0, 0, Math.PI * 2); ctx.fill();
                // 头
                ctx.fillStyle = '#f5d6a8';
                ctx.beginPath(); ctx.arc(0, -15, 12, 0, Math.PI * 2); ctx.fill();
                // 帽子
                ctx.fillStyle = '#333';
                ctx.beginPath(); ctx.moveTo(-15, -20); ctx.lineTo(15, -20); ctx.lineTo(10, -30); ctx.lineTo(-10, -30); ctx.fill();
                
                // 眼睛
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(-5, -15, 3, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(5, -15, 3, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(-5, -15, 1.5, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(5, -15, 1.5, 0, Math.PI * 2); ctx.fill();

                // 名字
                ctx.fillStyle = '#fff';
                ctx.font = '10px sans-serif';
                ctx.fillText('梁冀', 0, 5);
                
                ctx.restore();
            }

            function drawBox(b) {
                ctx.fillStyle = '#654321';
                ctx.fillRect(b.x - 30, b.y - 30, 60, 60);
                ctx.strokeStyle = '#3e2723';
                ctx.lineWidth = 2;
                ctx.strokeRect(b.x - 30, b.y - 30, 60, 60);
                
                ctx.fillStyle = '#8d6e63';
                ctx.fillRect(b.x - 25, b.y - 25, 50, 50);
                
                if (!b.opened) {
                    ctx.fillStyle = '#d7ccc8';
                    ctx.fillRect(b.x - 5, b.y - 5, 10, 10);
                } else {
                    ctx.fillStyle = '#fff';
                    ctx.font = '12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('已开', b.x, b.y);
                }
            }

            function drawProjectile(p) {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(Math.atan2(p.vy, p.vx));
                
                // 剑身
                ctx.fillStyle = '#e0e0e0';
                ctx.fillRect(-15, -3, 30, 6);
                // 剑尖
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.moveTo(15, -3);
                ctx.lineTo(25, 0);
                ctx.lineTo(15, 3);
                ctx.fill();
                // 剑柄
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(-20, -2, 5, 4);
                ctx.fillRect(-18, -5, 2, 10);
                
                ctx.restore();
            }

            function drawAimLine() {
                if (!isDragging) return;
                
                ctx.beginPath();
                ctx.moveTo(launcher.x, launcher.y);
                ctx.lineTo(dragEnd.x, dragEnd.y);
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)';
                ctx.lineWidth = 3;
                ctx.stroke();

                // 畫出預計發射方向
                let dx = dragStart.x - dragEnd.x;
                let dy = dragStart.y - dragEnd.y;
                let len = Math.sqrt(dx*dx + dy*dy);
                
                if (len > 0) {
                    ctx.beginPath();
                    ctx.moveTo(launcher.x, launcher.y);
                    // 放大5倍顯示預測線
                    ctx.lineTo(launcher.x + (dx/len)*100, launcher.y + (dy/len)*100);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.setLineDash([5, 5]);
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            // ===== 遊戲邏輯 =====
            function initLevel(lvl) {
                level = lvl;
                let configIndex = (lvl - 1) % levelConfigs.length;
                let config = levelConfigs[configIndex];
                
                boxes = [];
                enemies = [];
                
                // 建立寶箱
                config.forEach((pos) => {
                    boxes.push({ x: pos.x, y: pos.y, opened: false, hasEnemy: true });
                });

                // 建立寶箱外的敵人
                let enemyCount = lvl + 2;
                for(let i=0; i<enemyCount; i++) {
                    enemies.push({
                        x: randomRange(50, W-50),
                        y: randomRange(50, H-150),
                        vx: randomRange(-1, 1),
                        vy: randomRange(-1, 1)
                    });
                }
                updateUI();
            }

            function updateUI() {
                scoreText.innerText = '分数: ' + score;
                levelText.innerText = '关卡: ' + level;
                ammoText.innerText = '弹药: ' + ammo;
            }

            function gameLoop() {
                if (!gameRunning) return;

                ctx.clearRect(0, 0, W, H);
                drawBackground();
                drawLauncher();

                // 繪製與更新寶箱
                boxes.forEach(b => drawBox(b));

                // 繪製與更新敵人
                enemies.forEach((e, index) => {
                    e.x += e.vx;
                    e.y += e.vy;
                    // 簡單邊界反彈
                    if (e.x < 20 || e.x > W - 20) e.vx *= -1;
                    if (e.y < 20 || e.y > H - 150) e.vy *= -1;
                    drawEnemy(e);
                });

                // 繪製與更新子彈
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    let p = projectiles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    
                    let hit = false;
                    
                    // 碰撞敵人
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        if (checkCollision(p, 5, enemies[j], 20)) {
                            enemies.splice(j, 1);
                            hit = true;
                            score += 10;
                            break;
                        }
                    }

                    if (!hit) {
                        // 碰撞寶箱
                        for (let b of boxes) {
                            if (!b.opened && checkCollision(p, 5, {x: b.x, y: b.y}, 30)) {
                                b.opened = true;
                                if (b.hasEnemy) {
                                    enemies.push({ x: b.x, y: b.y, vx: 2, vy: -2 });
                                }
                                hit = true;
                                break;
                            }
                        }
                    }

                    // 移除出界或碰撞過的子彈
                    if (hit || p.x < 0 || p.x > W || p.y < 0 || p.y > H) {
                        projectiles.splice(i, 1);
                    } else {
                        drawProjectile(p);
                    }
                }

                drawAimLine();
                updateUI();

                // 檢查過關與失敗
                if (enemies.length === 0 && boxes.every(b => b.opened)) {
                    setTimeout(() => {
                        if(gameRunning) {
                            score += 50;
                            initLevel(level + 1);
                        }
                    }, 500);
                } else if (ammo <= 0 && projectiles.length === 0) {
                    endGame(false);
                } else {
                    requestAnimationFrame(gameLoop);
                }
            }

            function endGame(isWin) {
                gameRunning = false;
                gameOverScreen.style.display = 'flex';
                if (isWin) {
                    endTitle.innerText = '恭喜通关！';
                    endMsg.innerText = '你成功消灭了所有的梁冀！';
                } else {
                    endTitle.innerText = '游戏结束';
                    endMsg.innerText = '弹药耗尽，吕洞宾无法继续战斗。';
                }
                finalScore.innerText = '最终得分: ' + score;
            }

            function startGame() {
                score = 0;
                ammo = 5;
                projectiles = [];
                startScreen.style.display = 'none';
                gameOverScreen.style.display = 'none';
                gameRunning = true;
                initLevel(1);
                requestAnimationFrame(gameLoop);
            }

            // ===== 事件綁定 (解決按鈕沒反應的核心) =====
            document.getElementById('startBtn').addEventListener('click', function() {
                initAudio();
                startGame();
            });

            document.getElementById('restartBtn').addEventListener('click', function() {
                startGame();
            });

            // 觸控/滑鼠事件
            function getMousePos(evt) {
                let rect = canvas.getBoundingClientRect();
                return {
                    x: evt.clientX - rect.left,
                    y: evt.clientY - rect.top
                };
            }

            function handleStart(e) {
                if (!gameRunning || ammo <= 0) return;
                e.preventDefault();
                let pos = e.touches ? e.touches[0] : e;
                let mouse = getMousePos(pos);
                
                let dx = mouse.x - launcher.x;
                let dy = mouse.y - launcher.y;
                if (dx*dx + dy*dy < 2500) { // 半徑50內點擊
                    isDragging = true;
                    dragStart = { x: launcher.x, y: launcher.y };
                    dragEnd = mouse;
                }
            }

            function handleMove(e) {
                if (!isDragging) return;
                e.preventDefault();
                let pos = e.touches ? e.touches[0] : e;
                dragEnd = getMousePos(pos);
            }

            function handleEnd(e) {
                if (!isDragging) return;
                isDragging = false;
                
                let dx = dragStart.x - dragEnd.x;
                let dy = dragStart.y - dragEnd.y;
                let power = Math.sqrt(dx*dx + dy*dy);
                
                if (power > 10) { // 最小拉力
                    let len = Math.sqrt(dx*dx + dy*dy);
                    let speed = Math.min(power * 0.15, 15); // 限制最大速度
                    
                    projectiles.push({
                        x: launcher.x,
                        y: launcher.y,
                        vx: (dx / len) * speed,
                        vy: (dy / len) * speed
                    });
                    ammo--;
                    updateUI();
                }
            }

            canvas.addEventListener('mousedown', handleStart);
            canvas.addEventListener('mousemove', handleMove);
            canvas.addEventListener('mouseup', handleEnd);
            canvas.addEventListener('touchstart', handleStart, {passive: false});
            canvas.addEventListener('touchmove', handleMove, {passive: false});
            canvas.addEventListener('touchend', handleEnd, {passive: false});

            // 簡單的音效系統
            let audioCtx;
            function initAudio() {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            function playSound(type) {
                if (!audioCtx) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                if (type === 'launch') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'hit') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                }
            }
        };
    </script>
</body>
</html>
